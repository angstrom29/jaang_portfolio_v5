    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'glow': 'glow 2s infinite',
              'glow-white': 'glow-white 2s infinite',
            },
            keyframes: {
              'glow': {
                '0%': { boxShadow: '0 0 0 0 rgba(249, 115, 22, 0.7)' },
                '70%': { boxShadow: '0 0 0 10px rgba(249, 115, 22, 0)' },
                '100%': { boxShadow: '0 0 0 0 rgba(249, 115, 22, 0)' },
              },
              'glow-white': {
                '0%': { boxShadow: '0 0 0 0 rgba(255, 255, 255, 0.7)' },
                '70%': { boxShadow: '0 0 0 10px rgba(255, 255, 255, 0)' },
                '100%': { boxShadow: '0 0 0 0 rgba(255, 255, 255, 0)' },
              }
            }
          }
        }
      }
    </script>
    <script>
      // Immediately invoke function to set the theme before react hydrates to prevent flash
      (function() {
        try {
          const localTheme = localStorage.getItem('theme');
          const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          
          if (localTheme === 'dark' || (!localTheme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          console.error('Theme setup failed', e);
        }
      })();
    </script>
    <style>
